# Exposes only the dashboard (port 80 -> 8080). The MCP port stays cluster-internal.
# The dashboard has no login of its own: keep it private or add auth at the ingress
# (see README.md, "Basic auth").
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trendradar
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
    # nginx.ingress.kubernetes.io/auth-type: basic
    # nginx.ingress.kubernetes.io/auth-secret: trendradar-basic-auth
    # nginx.ingress.kubernetes.io/auth-realm: "TrendRadar"
spec:
  ingressClassName: nginx
  rules:
    - host: trendradar.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trendradar
                port:
                  name: http
  # tls:
  #   - hosts: [trendradar.example.com]
  #     secretName: trendradar-tls
